.ov p{margin:0;max-width:38ch;opacity:.75;font-size:1.1rem;line-height:1.55}
.opts{display:flex;gap:1.6rem;font-size:1rem;opacity:.85}
.opts label{display:flex;gap:.5rem;align-items:center;cursor:pointer}
button{font:inherit;font-weight:500;font-size:1.1rem;color:var(--fg);background:transparent;border:1px solid var(--ac);padding:.8rem 2.6rem;border-radius:4px;cursor:pointer;transition:background .3s,color .3s;pointer-events:auto}
